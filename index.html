<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four40 Renovations</title>
<meta name="description" content="Four40 — home renovations, built around the light.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Four40 Renovations">
<meta property="og:description" content="Kitchens, bathrooms, extensions and interiors — renovations built around the light.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1430'/%3E%3Cg fill='%231f5cff'%3E%3Crect x='7' y='7' width='8' height='8'/%3E%3Crect x='17' y='7' width='8' height='8'/%3E%3Crect x='7' y='17' width='8' height='8'/%3E%3C/g%3E%3Crect x='17' y='17' width='8' height='8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/rodin-pro-db.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Rodin Pro";
    src: url("fonts/rodin-pro-db.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap;
  }
  :root {
    --white: #ffffff;
    --ink: #0a1430;
    --ink-soft: #4a5874;
    --blue: #1f5cff;
    --blue-deep: #0f3fd1;
    --line: rgba(31, 92, 255, 0.28);
    /* safe areas (notch / home indicator) — the room fills the whole screen, controls stay clear */
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    /* glass */
    --glass: rgba(255, 255, 255, .5);
    --glass-strong: rgba(255, 255, 255, .66);
    --glass-edge: rgba(255, 255, 255, .8);
    --glass-blur: blur(14px) saturate(1.6);
    --glass-shadow: 0 10px 30px -14px rgba(15, 40, 120, .32), inset 0 1px 0 rgba(255, 255, 255, .85);
    --rodin: "Rodin Pro", "Hiragino Kaku Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    --mono: var(--rodin);
    --display: var(--rodin);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #e6ecf7; color: var(--ink);
    font-family: var(--mono); overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    /* no long-press selection / copy menus anywhere */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  img, svg, a { -webkit-user-drag: none; }

  /* the room is a sticky card; scrolling slides the footer over it while it collapses back */
  #hero {
    position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: var(--white);
    transform-origin: 50% 0; will-change: transform; transform: translateZ(0);
  }
  #veil { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: #f1f5fc; opacity: 0; will-change: opacity; }

  /* Scroll-linked effects run on the browser's compositor when supported (smooth during iOS momentum scrolling).
     The page's scroll range is exactly the footer's height, so percentages below are "how far the footer is up". */
  @supports (animation-timeline: scroll()) {
    #wash, #veil, #hero { animation-timeline: scroll(root block); animation-fill-mode: both; animation-duration: 1ms; }
    #wash { animation-name: washUp; }
    #veil { animation-name: veilIn; }
    #hero { animation-name: heroBack; animation-timing-function: linear; }
    .compact #hero { animation-name: none; }
  }
  @keyframes washUp {
    0%   { transform: translate3d(0, 130%, 0); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    78%  { transform: translate3d(0, -130%, 0); }
    100% { transform: translate3d(0, -130%, 0); }
  }
  @keyframes veilIn { 0% { opacity: 0; } 40% { opacity: .05; } 56% { opacity: .92; } 100% { opacity: 1; } }
  @keyframes heroBack { 0% { transform: translate3d(0, 0, 0) scale(1); } 85%, 100% { transform: translate3d(0, 2vh, 0) scale(.9); } }
  /* phones: no live blur behind the footer (the moving wash would be re-blurred every frame) */
  .compact .site { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255, 255, 255, .9); }
  /* clean blue wipe that washes up over the room as the footer arrives, then carries on out of view */
  #wash {
    position: absolute; left: 0; right: 0; top: -14%; height: 128%; z-index: 5; pointer-events: none;
    background: linear-gradient(180deg, #3570ff 0%, #1f5cff 40%, #1546e0 100%);
    clip-path: polygon(0 7%, 100% 0, 100% 93%, 0 100%);
    transform: translate3d(0, 130%, 0); will-change: transform;
  }
  #wash::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 9%; background: linear-gradient(180deg, rgba(255,255,255,.35), transparent); clip-path: polygon(0 78%, 100% 0, 100% 22%, 0 100%); }

  /* ---------- Scene ---------- */
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  html, body { overscroll-behavior-x: none; }
  #scene .face { stroke: none; }
  #scene .edge { fill: none; stroke: var(--blue); stroke-width: 1; stroke-linejoin: round; }
  #scene .wedge { fill: none; stroke: var(--blue); stroke-width: 0.022; }
  #scene .obj path.s { fill: none; stroke-linecap: round; }
  .logo-word { font-family: var(--display); font-weight: 600; letter-spacing: -0.03em; paint-order: stroke; stroke: #fff; stroke-width: .08; stroke-linejoin: round; }
  .logo-sub  { font-family: var(--mono); font-weight: 600; letter-spacing: 0.38em; paint-order: stroke; stroke: #fff; stroke-width: .06; }
  .band-serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  .band-mono  { font-family: var(--mono); font-weight: 500; letter-spacing: .32em; text-transform: uppercase; }
  .callout { cursor: pointer; }
  .callout text { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .callout text .idx { fill: var(--blue); }
  .callout polyline { fill: none; stroke: var(--blue); stroke-width: 1; }
  .callout circle { fill: var(--blue); }
  .callout:hover text, .callout:focus-visible text { fill: var(--blue); }
  .callout:focus-visible { outline: none; }
  .callout:focus-visible polyline { stroke-width: 2; }
  #cta:focus-visible, #replay:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  #door { cursor: pointer; }

  /* ---------- UI overlay ---------- */
  .ui { position: absolute; inset: 0; pointer-events: none; }
  footer.bar .hint { color: var(--ink-soft); text-decoration: none; display: flex; gap: 8px; align-items: center; }
  footer.bar .hint span { display: inline-block; color: var(--blue); animation: nudge 1.8s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(3px); } }

  /* ---------- site footer (below the room) ---------- */
  .site {
    position: relative; z-index: 2; margin-top: -1px;
    padding: 44px calc(clamp(20px, 5vw, 64px) + var(--sar)) calc(28px + var(--sab)) calc(clamp(20px, 5vw, 64px) + var(--sal));
    background: rgba(255, 255, 255, .72); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border-radius: 28px 28px 0 0; border-top: 1px solid var(--glass-edge);
    box-shadow: 0 -20px 50px -30px rgba(15, 40, 120, .35), inset 0 1px 0 rgba(255,255,255,.9);
    font-size: 13px; letter-spacing: .04em;
  }
  .sf-top { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between; padding-bottom: 32px; border-bottom: 1px solid var(--line); }
  .sf-logo { font: 600 clamp(40px, 8vw, 72px)/1 var(--display); letter-spacing: -.03em; }
  .sf-logo b { color: var(--blue); font-weight: 600; }
  .sf-brand p { margin-top: 10px; color: var(--ink-soft); font-size: 14px; }
  .sf-cta { display: flex; align-items: stretch; text-decoration: none; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; min-height: 52px; }
  .sf-cta span { display: flex; align-items: center; padding: 0 20px; background: rgba(10, 20, 48, .9); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .sf-cta i { display: flex; align-items: center; justify-content: center; width: 54px; background: var(--blue); color: #fff; font-style: normal; font-size: 18px; margin-left: 3px; }
  .sf-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 32px 0; }
  .sf-cols h4 { font: 600 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--blue); margin-bottom: 14px; }
  .sf-cols a { display: block; padding: 8px 0; color: var(--ink); text-decoration: none; font-size: 15px; }
  .sf-cols a:active, .sf-cols a:hover { color: var(--blue); }
  .sf-bottom { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-top: 22px; border-top: 1px solid var(--line); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .sf-bottom .acts { display: flex; gap: 20px; }
  .sf-bottom button, .sf-bottom a { background: none; border: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--blue); text-decoration: none; cursor: pointer; padding: 10px 0; }
  @media (max-width: 560px) { .sf-cols { grid-template-columns: 1fr 1fr; } .sf-cta { width: 100%; } .sf-cta span { flex: 1; justify-content: center; } }
  .ui a, .ui button { pointer-events: auto; }

  /* menu revealed behind the opened right wall */
  .menu { position: absolute; top: 30vh; display: flex; flex-direction: column; gap: 6px; padding: 18px 18px 18px 10px; border-radius: 3px; }
  .menu::before {
    content: ""; position: absolute; inset: 0; z-index: -2; border-radius: inherit;
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    opacity: 0; transform: translateX(24px); transition: opacity .6s, transform .8s cubic-bezier(.2,.9,.25,1);
  }
  .menu-in .menu::before { opacity: 1; transform: none; }
  .menu .label {
    font-size: 10px; letter-spacing: .3em; color: var(--blue); text-transform: uppercase; margin-bottom: 14px;
    opacity: 0; transition: opacity .6s;
  }
  .menu a {
    position: relative; display: flex; align-items: baseline; gap: 14px;
    padding: 6px 14px 8px 10px; color: var(--ink); text-decoration: none;
    font: 500 var(--menu-size, 26px)/1 var(--display); text-transform: uppercase; letter-spacing: -.01em;
    opacity: 0; transform: translateX(60px) skewX(-14deg);
    transition: opacity .5s, transform .7s cubic-bezier(.2,.9,.25,1), color .25s;
  }
  .menu a .n { font: 500 11px var(--mono); color: var(--blue); letter-spacing: .1em; transition: color .25s; }
  .menu a::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--blue); transform: skewX(-14deg) scaleX(0); transform-origin: left;
    transition: transform .35s cubic-bezier(.7,0,.2,1);
  }
  .menu a:hover, .menu a:focus-visible { color: #fff; outline: none; }
  .menu a:hover .n, .menu a:focus-visible .n { color: #fff; }
  .menu a:hover::before, .menu a:focus-visible::before { transform: skewX(-14deg) scaleX(1); }
  .menu-in .menu .label { opacity: 1; }
  .menu-in .menu a { opacity: 1; transform: none; }
  .menu-in .menu a:nth-of-type(2) { transition-delay: .08s; }
  .menu-in .menu a:nth-of-type(3) { transition-delay: .16s; }
  .menu-in .menu a:nth-of-type(4) { transition-delay: .24s; }
  /* entry wipe: a blue bar runs across each item as it lands */
  .menu a::after {
    content: ""; position: absolute; inset: 0; background: var(--blue); pointer-events: none;
    transform: skewX(-14deg) scaleX(1); transform-origin: right;
    transition: transform .55s cubic-bezier(.7,0,.2,1) .25s;
  }
  .menu-in .menu a::after { transform: skewX(-14deg) scaleX(0); }
  .menu-in .menu a:nth-of-type(2)::after { transition-delay: .33s; }
  .menu-in .menu a:nth-of-type(3)::after { transition-delay: .41s; }
  .menu-in .menu a:nth-of-type(4)::after { transition-delay: .49s; }

  /* door call-to-action tag */
  #cta {
    position: absolute; left: 0; top: 0; display: flex; align-items: stretch;
    text-decoration: none; font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase;
    opacity: 0; transition: opacity .4s; white-space: nowrap;
  }
  #cta span {
    background: rgba(10, 20, 48, .9); color: #fff; padding: 9px 12px 9px 14px; transform: skewX(-12deg);
    -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 10px 26px -12px rgba(10, 20, 48, .55);
  }
  #cta span b { display: inline-block; transform: skewX(12deg); font-weight: 500; }
  #cta i { background: var(--blue); color: #fff; font-style: normal; padding: 9px 11px; transform: skewX(-12deg); margin-left: 3px; transition: transform .3s; }
  #cta:hover i, #cta.open i { transform: skewX(-12deg) translateX(4px); }
  .cta-in #cta { opacity: 1; }

  footer.bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: calc(40px + var(--sab)); padding-bottom: var(--sab);
    display: flex; align-items: center; justify-content: space-between;
    padding-left: calc(clamp(16px, 3vw, 48px) + var(--sal)); padding-right: calc(clamp(16px, 3vw, 48px) + var(--sar));
    font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft);
    background: var(--glass-strong); border-top: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: 0 -10px 30px -18px rgba(15, 40, 120, .25), inset 0 1px 0 rgba(31, 92, 255, .14);
  }
  footer.bar::before {
    content: ""; position: absolute; left: 0; top: -1px; height: 2px; width: 100%;
    background: var(--blue); transform: scaleX(var(--prog, 0)); transform-origin: left;
  }
  footer .links { display: flex; gap: 22px; align-items: center; }
  #replay { background: none; border: 0; color: var(--blue); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #replay svg { width: 13px; height: 13px; }

  /* compact layout (phones): menu becomes a 2×2 grid of large buttons, CTA becomes a full-width bar */
  .compact .menu { top: auto !important; left: calc(16px + var(--sal)) !important; right: calc(16px + var(--sar)); bottom: calc(54px + var(--sab)); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0; }
  .compact .menu::before { display: none; }
  .compact .menu .label { display: none; }
  .compact .menu a {
    --menu-size: 15px; min-height: 50px; padding: 0 14px; gap: 10px; align-items: center;
    background: var(--glass); border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(31,92,255,.38), inset 0 1px 0 rgba(255,255,255,.9), 0 10px 24px -14px rgba(15,40,120,.35);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    -webkit-tap-highlight-color: transparent;
  }
  .compact .menu a::before { transform: skewX(0) scaleX(0); }
  .compact .menu a::after { transform: scaleX(1); }
  .compact.menu-in .menu a::after { transform: scaleX(0); }
  .compact .menu a:active { color: #fff; }
  .compact .menu a:active .n { color: #fff; }
  .compact .menu a:active::before { transform: skewX(0) scaleX(1); transition-duration: .12s; }
  .compact .menu a .n { font-size: 12px; }
  .compact #cta { left: calc(16px + var(--sal)) !important; right: calc(16px + var(--sar)); top: auto !important; bottom: calc(170px + var(--sab)); height: 54px; font-size: 13px; -webkit-tap-highlight-color: transparent; }
  .compact #cta span { flex: 1; display: flex; align-items: center; justify-content: center; transform: none; padding: 0 16px; }
  .compact #cta span b { transform: none; }
  .compact #cta i { display: flex; align-items: center; justify-content: center; width: 58px; transform: none; font-size: 18px; padding: 0; }
  .compact #cta:active span { background: var(--blue); }
  .compact .callout text { font-size: 12.5px; }
  .callout .chip { fill: rgba(255,255,255,.9); stroke: rgba(31,92,255,.45); stroke-width: 1; }
  .callout:active .chip { fill: var(--blue); }
  .callout:active text, .callout:active text .idx { fill: #fff; }
  .compact footer.bar { height: calc(44px + var(--sab)); }
  .compact #replay { padding: 10px 0 10px 12px; }
</style>
</head>
<body>

<div id="hero">
<svg id="scene" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5fc"/><stop offset="1" stop-color="#fbfcfe"/></linearGradient>
    <linearGradient id="gLeft" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#e5ecf8"/></linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9eff9"/><stop offset="1" stop-color="#d4dff1"/></linearGradient>
    <linearGradient id="gCeil" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f8fafd"/><stop offset="1" stop-color="#eef3fa"/></linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#2a63ff"/><stop offset="1" stop-color="#7fa6ff"/></linearGradient>
    <linearGradient id="gDoorway" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5cff"/><stop offset="1" stop-color="#8fb0ff"/></linearGradient>
    <radialGradient id="gSun">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ffffff"/>
      <stop offset=".68" stop-color="#e3ecff"/><stop offset="1" stop-color="#e3ecff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5cff" stop-opacity=".22"/><stop offset=".8" stop-color="#1f5cff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipFloor"><polygon id="floorClipPoly"/></clipPath>
    <!-- the window's light on the floor: furniture can only cast a shadow where it blocks this light -->
    <clipPath id="clipLight"></clipPath>
    <radialGradient id="gContact"><stop offset="0" stop-color="#0a1430" stop-opacity=".2"/><stop offset="1" stop-color="#0a1430" stop-opacity="0"/></radialGradient>
    <clipPath id="clipPanes" clipPathUnits="userSpaceOnUse"></clipPath>
    <!-- light shaft: fades from the window down to the floor (gradient endpoints move with the light) -->
    <linearGradient id="gBeam" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f5cff" stop-opacity=".12"/><stop offset="1" stop-color="#1f5cff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="faces">
    <polygon id="ceil"  class="face" fill="url(#gCeil)"/>
    <polygon id="floor" class="face" fill="url(#gFloor)"/>
    <polygon id="left"  class="face" fill="url(#gLeft)"/>
    <polygon id="back"  class="face" fill="#ffffff"/>
  </g>

  <!-- door on the left wall: lit doorway + leaf -->
  <g id="door" opacity="0">
    <polygon id="doorway" fill="url(#gDoorway)"/>
    <polygon id="doorSpill" fill="#1f5cff" opacity="0"/>
    <clipPath id="clipDoor"><polygon id="doorClipPoly"/></clipPath>
    <polygon id="doorLeaf" clip-path="url(#clipDoor)" fill="#0a1430" stroke="#1f5cff" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon id="doorFrame" fill="none" stroke="#1f5cff" stroke-width="1.5" pathLength="1" stroke-dasharray="1"/>
  </g>

  <g clip-path="url(#clipFloor)">
    <g id="reflect"></g>
    <g id="floorLight"></g>
    <g id="shadows"></g>
  </g>

  <!-- back-wall content in wall coordinates (world units, y down) -->
  <g id="wall">
    <g id="window">
      <rect id="winGlow" fill="#1f5cff" opacity="0"/>
      <g id="panes"></g>
    </g>
  </g>
  <!-- sun sits behind the wall (parallax), seen only through the glass -->
  <g clip-path="url(#clipPanes)"><circle id="sun" fill="url(#gSun)"/></g>
  <g id="wallTop">
    <g id="paneEdges"></g>
    <rect id="winFrame" class="wedge" pathLength="1" stroke-dasharray="1"/>
  </g>

  <!-- right wall drawn late so it can swing open over the scene -->
  <polygon id="right" class="face" fill="url(#gRight)"/>
  <polygon id="rightFlash" fill="#1f5cff" opacity="0"/>

  <g id="edges"></g>

  <g id="beam"></g>
  <g id="objects"></g>
  <g id="dust"></g>

  <!-- foreground bands -->
  <g id="bandA" opacity="0"><rect fill="#0a1430"/><g class="run"><text class="band-serif" fill="#ffffff"></text></g></g>
  <g id="bandB" opacity="0"><rect fill="#1f5cff" opacity=".9"/><g class="run"><text class="band-mono" fill="#ffffff"></text></g></g>

  <g id="callouts"></g>

  <g id="logo">
    <text class="logo-word" x="0" y="0" font-size="1"><tspan fill="#0a1430">FOUR</tspan><tspan fill="#1f5cff">40</tspan></text>
    <text class="logo-sub" x="0.04" y="0.5" font-size="0.25" fill="#0a1430">RENOVATIONS</text>
  </g>
</svg>

<div class="ui" id="ui">
  <nav class="menu" id="menu" aria-label="Primary">
    <div class="label">Index</div>
    <a href="#services"><span class="n">01</span><span>Services</span></a>
    <a href="#projects"><span class="n">02</span><span>Projects</span></a>
    <a href="#process"><span class="n">03</span><span>Process</span></a>
    <a href="#contact"><span class="n">04</span><span>Contact</span></a>
  </nav>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const svg = $('scene');

  // ---------- World. x: left→right, y: floor→ceiling, z: back wall (0) → camera ----------
  const W2 = 5, H = 6.5;
  const WIN = { x0: -0.4, x1: 2.6, y0: 2.4, y1: 5.4, cols: 4, rows: 4, gap: 0.07 };
  const WC = { x: (WIN.x0 + WIN.x1) / 2, y: (WIN.y0 + WIN.y1) / 2 };
  const LOGO = { x: -4.55, y: 5.55, size: 0.78 };
  // landscape: in the left wall; portrait: in the back wall (the left wall is too foreshortened there)
  const DOORS = {
    L: { a: [-W2, 0, 3.0], b: [-W2, 0, 4.4], h: 3.5, hingeB: true, n: [-1, 0, 0] },
    P: { a: [-4.3, 0, 0], b: [-2.9, 0, 0], h: 3.2, hingeB: false, n: [0, 0, -1] },
  };
  let DOOR = DOORS.L;
  const SUN = { D: 3, R: 2.1 };

  // ---------- Timeline (ms) ----------
  const T = {
    // phases overlap so the build reads as one continuous move
    edges: [0, 700], faces: [100, 800], cam: [100, 2100], reflect: [500, 1700], logo: [1500, 2250],
    outline: [1300, 1950], fill: [1600, 2300], sun: [1900, 3700], light: [2100, 3700],
    bandA: [2300, 3000], bandB: [2500, 3250],
    wallFlash: [2900, 3150], wallOpen: [3000, 3900], menu: 3500,
    door: [4600, 5300], cta: 5100, end: 5800,
  };
  // global pace: < 1 = faster. Everything (incl. furniture entrances) scales together.
  const PACE = 0.82;
  for (const k in T) T[k] = Array.isArray(T[k]) ? T[k].map(v => v * PACE) : T[k] * PACE;

  // ---------- easing ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const prog = (t, [a, b]) => clamp((t - a) / (b - a));
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const easeOutBounce = t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
    return n * (t -= 2.625 / d) * t + .984375;
  };

  // ---------- layout / camera keyframes ----------
  let vw = 0, vh = 0, K0, K1, S0, compact = false;
  // safe-area insets in px (0 on devices without a notch)
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:var(--sat) var(--sar) var(--sab) var(--sal)';
  document.body.appendChild(probe);
  let SA = { t: 0, b: 0, l: 0, r: 0 };
  const hero = $('hero');
  let lastW = 0, lastH = 0;
  function layout() {
    vw = hero.clientWidth; vh = hero.clientHeight;
    lastW = vw; lastH = vh;
    const cs = getComputedStyle(probe);
    SA = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
    svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
    const portrait = vw / vh < 0.9;
    if (portrait) {
      // fit the room between the logo strip and the bottom UI (band, CTA, menu row, footer)
      const f = Math.max(150, Math.min(0.86 * vw, (vh - 372 - SA.t - SA.b) / 1.065));
      K1 = { x: 0.6, y: 2.6, z: 11, f, px: 0.5 * vw, py: 92 + SA.t + 0.255 * f };
      K0 = { x: 0, y: H / 2, z: 20, f: f * 1.1, px: 0.5 * vw, py: 0.45 * vh };
    } else {
      const U = Math.min(vw, 1.78 * vh);
      K1 = { x: -3.0, y: 2.2, z: 10, f: 0.56 * U, px: 0.5 * vw - 0.205 * U, py: 0.42 * vh };
      K0 = { x: 0, y: H / 2, z: 18, f: 0.62 * U, px: 0.5 * vw, py: 0.5 * vh };
    }
    // resting sun: chosen so it reads at a fixed spot in the window from the final camera
    const want = { x: 1.75, y: 3.6 }, k = (K1.z + SUN.D) / K1.z;
    S0 = { x: K1.x + (want.x - K1.x) * k, y: K1.y + (want.y - K1.y) * k };

    // menu lives in the space revealed behind the right wall
    const backRight = K1.px + K1.f / K1.z * (W2 - K1.x);
    const menuLeft = backRight + Math.max(28, vw * 0.025);
    const menuW = vw - menuLeft - 20;
    compact = portrait || menuW < 210;
    document.body.classList.toggle('compact', compact);
    const menu = $('menu');
    menu.style.left = menuLeft + 'px';
    menu.style.setProperty('--menu-size', clamp(menuW / 9.5, 16, 30) + 'px');

    // furniture placement for this layout, drawn back-to-front
    OBJECTS.forEach(o => {
      const c = portrait ? o.P : o.L;
      o.hidden = !c;
      if (c) [o.x, o.z, o.dir = 1, o.rise = 20, o.flip = 0] = c;
    });
    [...OBJECTS].sort((a, b) => a.z - b.z).forEach(o => $('objects').appendChild(o.g));
    portraitMode = portrait;
    DOOR = portrait ? DOORS.P : DOORS.L;
    dust.forEach((d, i) => d.n.style.display = compact && i % 2 ? 'none' : '');
    layoutBands(portrait);
  }
  let portraitMode = false;

  // ---------- projection ----------
  let C;
  const NEAR = 0.12;
  const P = (x, y, z) => {
    const d = Math.max(C.z - z, NEAR);
    return [C.px + C.f * (x - C.x) / d, C.py - C.f * (y - C.y) / d];
  };
  const pts = arr => arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const poly = (...p3) => pts(p3.map(p => P(...p)));

  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent && parent.appendChild(n);
    return n;
  };

  // ---------- room edges ----------
  const edgeNames = ['back', 'left', 'right', 'floor', 'ceil'];
  const edgeEls = {};
  edgeNames.forEach(n => edgeEls[n] = el('polygon', { class: 'edge', pathLength: 1, 'stroke-dasharray': 1, opacity: .55 }, $('edges')));

  // ---------- window ----------
  const panes = [], paneEdges = [], lightPanes = [], paneClips = [], lightClips = [];
  const pw = (WIN.x1 - WIN.x0) / WIN.cols, ph = (WIN.y1 - WIN.y0) / WIN.rows, g = WIN.gap;
  for (let r = 0; r < WIN.rows; r++) for (let c = 0; c < WIN.cols; c++) {
    const x0 = WIN.x0 + c * pw + g, x1 = WIN.x0 + (c + 1) * pw - g;
    const y1 = WIN.y1 - r * ph - g, y0 = WIN.y1 - (r + 1) * ph + g;
    const rect = { x: x0, y: -y1, width: x1 - x0, height: y1 - y0 };
    panes.push({ r, c, x0, x1, y0, y1, fill: el('rect', { ...rect, fill: 'url(#gGlass)', opacity: 0 }, $('panes')) });
    paneClips.push(el('rect', rect, $('clipPanes')));
    paneEdges.push(el('rect', { ...rect, class: 'wedge', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, $('paneEdges')));
    lightPanes.push(el('polygon', { fill: '#1f5cff' }, $('floorLight')));
    lightClips.push(el('polygon', {}, $('clipLight')));
  }
  const fr = { x: WIN.x0 - 0.06, y: -WIN.y1 - 0.06, width: WIN.x1 - WIN.x0 + 0.12, height: WIN.y1 - WIN.y0 + 0.12 };
  for (const k in fr) { $('winFrame').setAttribute(k, fr[k]); $('winGlow').setAttribute(k, fr[k]); }

  // floor reflection of the logo (mirror image about y = 0, in wall space)
  const refl = $('logo').cloneNode(true); refl.removeAttribute('id');
  refl.setAttribute('transform', `translate(${LOGO.x} ${LOGO.y}) scale(${LOGO.size} ${-LOGO.size})`);
  refl.querySelectorAll('text').forEach(t => t.removeAttribute('class'));
  refl.querySelectorAll('tspan,text').forEach(t => t.setAttribute('fill', 'url(#gReflect)'));
  const reflWrap = el('g', {}, $('reflect')); reflWrap.appendChild(refl);

  const gBeam = $('gBeam');
  const beamQuads = [0, 1, 2, 3].map(() => el('polygon', { fill: 'url(#gBeam)' }, $('beam')));

  const dust = Array.from({ length: 26 }, () => ({
    u: Math.random(), v: Math.random(), t: Math.random(), s: .6 + Math.random() * .9,
    ph: Math.random() * 6.28, sp: .15 + Math.random() * .35,
    n: el('circle', { fill: '#1f5cff' }, $('dust')),
  }));

  // ---------- silhouettes: the room furnishes itself; each piece is a service ----------
  // Drawn in world units, origin at the floor contact point, y negative = up.
  const SHAPES = {
    ladder: { h: 1.98, d: [
      ['M-0.4,0 L-0.22,-1.9 M0.4,0 L0.22,-1.9', .07, 1],
      ['M0.3,-1.86 L0.62,0', .05, 1],
      ['M-0.36,-0.45 H0.36 M-0.31,-0.9 H0.31 M-0.27,-1.35 H0.27', .05, 1],
      ['M-0.3,-1.98 H0.3 V-1.86 H-0.3Z'],
    ]},
    island: { h: 1.0, d: [
      ['M-1.42,-0.99 H1.42 V-0.89 H-1.42Z'],
      ['M-1.3,-0.89 H1.3 V-0.07 H1.22 V0 H-1.22 V-0.07 H-1.3Z'],
      // stools at either end
      ['M1.58,-0.76 h0.42 v0.07 h-0.42z M1.62,-0.69 L1.57,0 h0.04 L1.68,-0.69z M1.96,-0.69 L2.01,0 h-0.04 L1.9,-0.69z M1.6,-0.26 h0.38 v0.03 h-0.38z'],
      ['M-2,-0.76 h0.42 v0.07 h-0.42z M-1.96,-0.69 L-2.01,0 h0.04 L-1.9,-0.69z M-1.62,-0.69 L-1.57,0 h-0.04 L-1.68,-0.69z M-1.98,-0.26 h0.38 v0.03 h-0.38z'],
    ]},
    pendants: { h: 6.5, d: [
      ['M-0.62,-6.5 V-3.1 M0.62,-6.5 V-3.1', .025, 1],
      ['M-0.95,-2.76 Q-0.93,-3.12 -0.62,-3.14 Q-0.31,-3.12 -0.29,-2.76Z M0.29,-2.76 Q0.31,-3.12 0.62,-3.14 Q0.93,-3.12 0.95,-2.76Z'],
    ]},
    tub: { h: 1.05, d: [
      ['M-0.9,-0.67 H0.9 V-0.6 H-0.9Z'],
      ['M-0.82,-0.6 H0.82 C0.82,-0.3 0.62,-0.16 0.4,-0.16 H-0.4 C-0.62,-0.16 -0.82,-0.3 -0.82,-0.6Z'],
      ['M0.42,-0.2 L0.6,-0.2 L0.64,0 L0.52,0Z M-0.42,-0.2 L-0.6,-0.2 L-0.64,0 L-0.52,0Z'],
      ['M1.02,0 V-0.96 Q1.02,-1.04 0.94,-1.04 H0.8', .045, 1],
    ]},
    armchair: { h: 1.02, d: [
      ['M-0.5,-0.44 L-0.64,-0.98 Q-0.62,-1.04 -0.53,-1.01 L-0.34,-0.44Z'],
      ['M-0.52,-0.46 H0.46 V-0.27 H-0.52Z'],
      ['M0.3,-0.64 H0.52 V-0.58 H0.46 V-0.3 H0.38 V-0.58 H0.3Z'],
      ['M-0.44,-0.28 L-0.5,0 H-0.45 L-0.36,-0.28Z M0.36,-0.28 L0.43,0 H0.48 L0.43,-0.28Z'],
    ]},
    lamp: { h: 1.8, d: [
      ['M-0.18,-0.04 H0.18 V0 H-0.18Z'],
      ['M0,0 V-1.52', .04, 1],
      ['M-0.21,-1.5 L0.21,-1.5 L0.13,-1.8 L-0.13,-1.8Z'],
    ]},
    plant: { h: 1.3, d: [
      ['M-0.2,-0.42 H0.2 L0.15,0 H-0.15Z'],
      ['M0,-0.42 Q-0.35,-0.8 -0.1,-1.15 Q0,-0.8 0,-0.42Z M0,-0.42 Q0.4,-0.75 0.32,-1.05 Q0.08,-0.8 0,-0.42Z M0,-0.42 Q-0.1,-0.9 0.05,-1.3 Q0.15,-0.9 0,-0.42Z M0,-0.42 Q-0.45,-0.55 -0.5,-0.82 Q-0.2,-0.7 0,-0.42Z M0,-0.42 Q0.42,-0.5 0.52,-0.7 Q0.2,-0.66 0,-0.42Z'],
    ]},
  };
  // half-width of each piece's footprint (world units), for contact shadows and label avoidance
  const FOOT = { ladder: .45, island: 2.0, tub: .95, armchair: .55, lamp: .2, plant: .22, pendants: .95 };

  // Placement per layout — L: landscape, P: portrait (null = not shown) — as
  // [x, z, label direction, label rise px (negative = label hangs below the piece), mirrored].
  const OBJECTS = [
    { shape: 'ladder',   L: [-3.7, 1.2, -1, 20],     P: [3.9, 3.8, -1, -18], at: 3400, anim: 'drop', label: ['01', 'Extensions'] },
    { shape: 'island',   L: [0.4, 2.8, -1, 20],      P: [0.6, 4.2, 1, 30],   at: 3800, anim: 'pop',  label: ['02', 'Kitchens'] },
    { shape: 'tub',      L: [3.7, 1.0, -1, 20],      P: [1.6, 7.6, -1, -24], at: 4000, anim: 'pop',  label: ['03', 'Bathrooms'] },
    { shape: 'pendants', L: [0.4, 2.8],              P: [0.6, 4.2],          at: 4150, anim: 'drop', dropFrom: 4, noShadow: 1, svc: 'Kitchens' },
    { shape: 'armchair', L: [1.6, 5.4, -1, -16, 1],   P: [-0.6, 7.4, 1, -14], at: 4250, anim: 'pop',  label: ['04', 'Interiors'] },
    { shape: 'lamp',     L: [-2.2, 5.9],             P: null,                at: 4400, anim: 'pop', svc: 'Interiors' },
    { shape: 'plant',    L: [-4.4, 0.8],             P: [-2.0, 1.0],         at: 4500, anim: 'pop' },
  ];
  const buildShape = (parent, s) => {
    for (const [d, sw, stroked] of s.d) {
      const p = el('path', { d }, parent);
      if (stroked) { p.setAttribute('class', 's'); p.setAttribute('stroke-width', sw); }
    }
  };
  OBJECTS.forEach(o => {
    const s = SHAPES[o.shape];
    o.h = s.h;
    o.at *= PACE;
    o.svc = o.label ? o.label[1] : o.svc;
    o.hl = 0; o.hlv = 0;
    o.g = el('g', { class: 'obj' }, $('objects'));
    o.inner = el('g', { 'stroke-width': 0 }, o.g);
    buildShape(o.inner, s);
    o.sg = el('g', {}, $('shadows'));
    o.sinner = el('g', { fill: '#0a1430', stroke: '#0a1430', 'stroke-width': 0 }, o.sg);
    buildShape(o.sinner, s);
    if (o.label) {
      const a = el('a', { href: '#services', class: 'callout', opacity: 0, 'aria-label': o.label[1] }, $('callouts'));
      o.cl = {
        a,
        line: el('polyline', { pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, a),
        hit: el('rect', { fill: 'transparent' }, a),
        chip: el('rect', { class: 'chip', rx: 2, width: 0, height: 0 }, a),
        dot: el('circle', { r: 2.5 }, a),
        text: el('text', {}, a),
      };
      el('tspan', { class: 'idx' }, o.cl.text).textContent = o.label[0] + '  ';
      el('tspan', {}, o.cl.text).textContent = o.label[1];
      el('tspan', { class: 'idx' }, o.cl.text).textContent = '  →';
      o.cl.w = 0;
    }
  });

  // hover / focus on a label or on a piece highlights the whole service
  const setHL = (svc, on) => OBJECTS.forEach(q => { if (q.svc === svc) q.hl = on ? 1 : 0; });
  OBJECTS.forEach(o => {
    if (!o.svc) return;
    const targets = [o.g, o.cl && o.cl.a].filter(Boolean);
    for (const n of targets) {
      n.addEventListener('pointerenter', () => setHL(o.svc, true));
      n.addEventListener('pointerleave', () => setHL(o.svc, false));
      n.addEventListener('focus', () => setHL(o.svc, true));
      n.addEventListener('blur', () => setHL(o.svc, false));
    }
    o.g.style.cursor = 'pointer';
    o.g.addEventListener('click', e => { e.stopPropagation(); location.hash = 'services'; });
  });

  // ---------- bands ----------
  const bandText = {
    A: 'Renovations built around the light — Kitchens · Bathrooms · Extensions · Interiors — ',
    B: 'Four40 — Design · Build · Renovate — ',
  };
  for (const k of ['A', 'B']) $('band' + k).querySelector('text').textContent = bandText[k].repeat(14);
  const bandWidths = { A: 0, B: 0 };
  // per-layout band setup (geometry + font size are static; only transforms animate)
  let BANDS = [];
  function layoutBands(portrait) {
    const diag = Math.hypot(vw, vh);
    const tA = clamp(vw * 0.026, 24, 40), tB = clamp(vw * 0.05, 40, 78);
    BANDS = [
      { key: 'A', time: T.bandA, thick: tA, speed: 26, fs: .62,
        from: { x: -0.25 * vw, y: 0.95 * vh, a: 18 },
        to: portrait ? { x: 0.5 * vw, y: vh - 185, a: -8, par: 20 } : { x: 0.33 * vw, y: 0.6 * vh, a: 66, par: 30 } },
      { key: 'B', time: T.bandB, thick: tB, speed: 18, fs: .26,
        from: { x: 0.65 * vw, y: 0.75 * vh, a: -42 },
        to: portrait ? { x: 0.6 * vw, y: 58 + SA.t, a: -10, par: 30 } : { x: 0.52 * vw, y: 0.02 * vh, a: -14, par: 45 } },
    ];
    // portrait: no bottom band — that space goes to the buttons
    $('bandA').style.display = portrait ? 'none' : '';
    if (portrait) BANDS = BANDS.filter(b => b.key !== 'A');
    for (const b of BANDS) {
      b.g = $('band' + b.key); b.run = b.g.querySelector('.run');
      const r = b.g.querySelector('rect'), tx = b.g.querySelector('text');
      r.setAttribute('x', -diag * 1.5); r.setAttribute('width', diag * 3);
      r.setAttribute('y', -b.thick / 2); r.setAttribute('height', b.thick);
      tx.setAttribute('x', -diag * 1.5); tx.setAttribute('y', b.thick * 0.2);
      tx.setAttribute('font-size', b.thick * b.fs);
    }
  }
  const measure = () => {
    for (const k of ['A', 'B']) {
      const t = $('band' + k).querySelector('text');
      bandWidths[k] = t.getComputedTextLength() / 14;
    }
    OBJECTS.forEach(o => o.cl && (o.cl.w = o.cl.text.getComputedTextLength()));
  };

  // ---------- light ----------
  // Light direction L = (a, -1, b): a wall/scene point at height y lands on the floor at (x + a*y, 0, z + b*y).
  let A = 0, B = 0;
  const toFloor = (x, y, z = 0) => [x + A * y, 0, z + B * y];

  // Affine mapping for a flat cut-out standing at (x0, z0), or its shadow on the floor.
  // Exact for the billboard (it is parallel to the image plane); a close fit for the shadow.
  function affine(x0, z0, hm, shadow) {
    const at = (lx, ly) => shadow ? P(...toFloor(x0 + lx, ly, z0)) : P(x0 + lx, ly, z0);
    const p0 = at(0, hm), p1 = at(1, hm), p2 = at(0, hm + 1);
    const ux = p1[0] - p0[0], uy = p1[1] - p0[1], vx = p2[0] - p0[0], vy = p2[1] - p0[1];
    return `matrix(${ux} ${uy} ${-vx} ${-vy} ${p0[0] - hm * vx} ${p0[1] - hm * vy})`;
  }

  // ---------- label planning ----------
  let labelPlanKey = '';
  function planLabels(menuIn) {
    const saved = C; C = { ...K1 };            // resting camera, no parallax
    const GAP = 10;
    const placed = [];
    if (!compact && menuIn) {
      const m = $('menu');
      placed.push([m.offsetLeft - 6, m.offsetLeft + m.offsetWidth + 6, m.offsetTop - 6, m.offsetTop + m.offsetHeight + 6]);
    }
    const maxY = compact ? vh - 232 - SA.b : vh - 48 - SA.b;
    // every visible piece is an obstacle (pendants: just the shades)
    for (const q of OBJECTS) {
      if (q.hidden) continue;

})();
