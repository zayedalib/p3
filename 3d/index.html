<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four40 Renovations — 3D</title>
<meta name="description" content="Four40 — home renovations, built around the light.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@1&family=Unbounded:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff; --ink: #0a1430; --ink-soft: #4a5874;
    --blue: #1f5cff; --line: rgba(31, 92, 255, 0.28);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --display: Unbounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #fff; color: var(--ink); font-family: var(--mono); overflow: hidden; -webkit-font-smoothing: antialiased; }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #overlay a { pointer-events: auto; }

  /* bands: flat foreground layers over the 3D room */
  .band { position: fixed; left: 0; top: 0; overflow: hidden; pointer-events: none; opacity: 0; will-change: transform; }
  .band .run { display: flex; white-space: nowrap; height: 100%; align-items: center; will-change: transform; animation: run var(--dur, 40s) linear infinite; }
  .band .run span { padding-right: .4em; }
  #bandA { background: var(--ink); color: #fff; font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  #bandB { background: rgba(31, 92, 255, .9); color: #fff; font-family: var(--mono); font-weight: 500; letter-spacing: .32em; text-transform: uppercase; }
  @keyframes run { to { transform: translateX(-50%); } }

  /* logo: rides the back wall, then docks in the corner */
  .logo { position: fixed; left: 0; top: 0; transform-origin: 0 0; font-size: 100px; line-height: 1; pointer-events: none; white-space: nowrap; will-change: transform; }
  .logo .word { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; -webkit-text-stroke: 0; paint-order: stroke; text-shadow: 0 0 .06em #fff, 0 0 .06em #fff; }
  .logo .word b { color: var(--blue); font-weight: 700; }
  .logo .sub { font-family: var(--mono); font-weight: 600; font-size: .25em; letter-spacing: .38em; margin-top: .25em; padding-left: .16em; }
  #logoReflect { color: var(--blue); opacity: .2; -webkit-mask-image: linear-gradient(to top, #000, transparent 75%); mask-image: linear-gradient(to top, #000, transparent 75%); }
  #logoReflect .word b { color: inherit; }

  .callout { cursor: pointer; }
  .callout text { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .callout text .idx { fill: var(--blue); }
  .callout polyline { fill: none; stroke: var(--blue); stroke-width: 1; }
  .callout circle { fill: var(--blue); }
  .callout:hover text { fill: var(--blue); }

  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui a, .ui button { pointer-events: auto; }
  .menu { position: absolute; top: 30vh; display: flex; flex-direction: column; gap: 6px; }
  .menu .label { font-size: 10px; letter-spacing: .3em; color: var(--blue); text-transform: uppercase; margin-bottom: 14px; opacity: 0; transition: opacity .6s; }
  .menu a {
    position: relative; display: flex; align-items: baseline; gap: 14px; padding: 6px 14px 8px 10px;
    color: var(--ink); text-decoration: none; font: 500 var(--menu-size, 26px)/1 var(--display); text-transform: uppercase; letter-spacing: -.01em;
    opacity: 0; transform: translateX(60px) skewX(-14deg); transition: opacity .5s, transform .7s cubic-bezier(.2,.9,.25,1), color .25s;
  }
  .menu a .n { font: 500 11px var(--mono); color: var(--blue); letter-spacing: .1em; transition: color .25s; }
  .menu a::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--blue); transform: skewX(-14deg) scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.7,0,.2,1); }
  .menu a:hover, .menu a:focus-visible { color: #fff; outline: none; }
  .menu a:hover .n, .menu a:focus-visible .n { color: #fff; }
  .menu a:hover::before, .menu a:focus-visible::before { transform: skewX(-14deg) scaleX(1); }
  .menu a::after { content: ""; position: absolute; inset: 0; background: var(--blue); pointer-events: none; transform: skewX(-14deg) scaleX(1); transform-origin: right; transition: transform .55s cubic-bezier(.7,0,.2,1) .25s; }
  .menu-in .menu .label { opacity: 1; }
  .menu-in .menu a { opacity: 1; transform: none; }
  .menu-in .menu a::after { transform: skewX(-14deg) scaleX(0); }
  .menu-in .menu a:nth-of-type(2) { transition-delay: .08s; } .menu-in .menu a:nth-of-type(2)::after { transition-delay: .33s; }
  .menu-in .menu a:nth-of-type(3) { transition-delay: .16s; } .menu-in .menu a:nth-of-type(3)::after { transition-delay: .41s; }
  .menu-in .menu a:nth-of-type(4) { transition-delay: .24s; } .menu-in .menu a:nth-of-type(4)::after { transition-delay: .49s; }

  #cta { position: absolute; left: 0; top: 0; display: flex; align-items: stretch; text-decoration: none; font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #cta span { background: var(--ink); color: #fff; padding: 9px 12px 9px 14px; transform: skewX(-12deg); }
  #cta span b { display: inline-block; transform: skewX(12deg); font-weight: 500; }
  #cta i { background: var(--blue); color: #fff; font-style: normal; padding: 9px 11px; transform: skewX(-12deg); margin-left: 3px; transition: transform .3s; }
  #cta:hover i, #cta.open i { transform: skewX(-12deg) translateX(4px); }
  .cta-in #cta { opacity: 1; }

  footer.bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 3vw, 48px); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft);
    background: #fff; border-top: 1px solid var(--line);
  }
  footer.bar::before { content: ""; position: absolute; left: 0; top: -1px; height: 2px; width: 100%; background: var(--blue); transform: scaleX(var(--prog, 0)); transform-origin: left; }
  footer .links { display: flex; gap: 22px; align-items: center; }
  footer a.alt, #replay { background: none; border: 0; color: var(--blue); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; display: flex; gap: 8px; align-items: center; text-decoration: none; }
  #replay svg { width: 13px; height: 13px; }

  .compact .menu { top: auto !important; left: 16px !important; right: 16px; bottom: 56px; flex-direction: row; flex-wrap: wrap; gap: 2px 4px; }
  .compact .menu .label { display: none; }
  .compact .menu a { --menu-size: 13px; padding: 7px 10px; gap: 8px; }
  .compact #cta { left: 16px !important; top: auto !important; bottom: 132px; }

  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 13px; letter-spacing: .08em; }
  #fallback a { color: var(--blue); }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div class="band" id="bandA"><div class="run"></div></div>
<div class="band" id="bandB"><div class="run"></div></div>

<svg id="overlay" xmlns="http://www.w3.org/2000/svg"><g id="callouts"></g></svg>

<div class="logo" id="logoReflect" aria-hidden="true"><div class="word">FOUR<b>40</b></div><div class="sub">RENOVATIONS</div></div>
<div class="logo" id="logo"><div class="word">FOUR<b>40</b></div><div class="sub">RENOVATIONS</div></div>

<div class="ui">
  <nav class="menu" id="menu" aria-label="Primary">
    <div class="label">Index</div>
    <a href="#services"><span class="n">01</span><span>Services</span></a>
    <a href="#projects"><span class="n">02</span><span>Projects</span></a>
    <a href="#process"><span class="n">03</span><span>Process</span></a>
    <a href="#contact"><span class="n">04</span><span>Contact</span></a>
  </nav>
  <a id="cta" href="#contact"><span><b>Book a consultation</b></span><i>→</i></a>
  <footer class="bar">
    <span>© Four40 Renovations</span>
    <span class="links">
      <a class="alt" href="../">2D version</a>
      <button id="replay" type="button" aria-label="Replay intro animation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Replay
      </button>
    </span>
  </footer>
</div>

<div id="fallback"><p>This version needs WebGL. <a href="../">View the 2D site →</a></p></div>

<script type="module">
import * as THREE from './three.module.min.js';

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

// ---------- World (same units as the 2D version). x: left→right, y: floor→ceiling, z: back wall (0) → camera ----------
const W2 = 5, H = 6.5, DEPTH = 26;
const WIN = { x0: -0.4, x1: 2.6, y0: 2.4, y1: 5.4, cols: 4, rows: 4, bar: 0.1 };
const WC = { x: (WIN.x0 + WIN.x1) / 2, y: (WIN.y0 + WIN.y1) / 2 };
const LOGO = { x: -4.55, y: 5.55, size: 0.78 };
const SUN = { D: 3, R: 1.7 };
const NAVY = new THREE.Color('#0f1a3a'), BLUE = new THREE.Color('#1f5cff');

// ---------- Timeline (ms) — identical to the 2D site ----------
const T = {
  edges: [0, 700], faces: [100, 800], cam: [100, 2100], reflect: [500, 1700], logo: [1500, 2250],
  outline: [1300, 1950], fill: [1600, 2300], sun: [1900, 3700], light: [2100, 3700],
  bandA: [2300, 3000], bandB: [2500, 3250],
  wallFlash: [2900, 3150], wallOpen: [3000, 3900], menu: 3500,
  door: [4600, 5300], cta: 5100, end: 5800,
};

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, [a, b]) => clamp((t - a) / (b - a));
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutBounce = t => {
  const n = 7.5625, d = 2.75;
  if (t < 1 / d) return n * t * t;
  if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
  if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
  return n * (t -= 2.625 / d) * t + .984375;
};

// ---------- renderer ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('fallback').style.display = 'flex';
  throw e;
}
renderer.setClearColor(0xffffff, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 120);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0xe4eaf6, 3.0));
const fill = new THREE.DirectionalLight(0xffffff, 1.35);
fill.position.set(2.5, 4, 10);
scene.add(fill);
// the sun: only reaches the room through the window (an invisible occluder blocks everything else)
const sun = new THREE.DirectionalLight(0xc9d9ff, 0);
sun.castShadow = true;
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// ---------- materials ----------
const lam = (c, extra = {}) => new THREE.MeshLambertMaterial({ color: c, transparent: true, opacity: 0, ...extra });
const M = {
  back: lam('#ffffff'), floor: lam('#e6edf8'), ceil: lam('#f7f9fd'),
  left: lam('#eef2fa'), right: lam('#e2e9f5', { emissive: new THREE.Color('#1f5cff'), emissiveIntensity: 0 }),
};
const faceMats = Object.values(M);

// ---------- room ----------
const room = new THREE.Group(); scene.add(room);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W2 * 2, DEPTH), M.floor);
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, DEPTH / 2); floor.receiveShadow = true;
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W2 * 2, DEPTH), M.ceil);
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, DEPTH / 2);
const left = new THREE.Mesh(new THREE.PlaneGeometry(DEPTH, H), M.left);
left.rotation.y = Math.PI / 2; left.position.set(-W2, H / 2, DEPTH / 2); left.receiveShadow = true;
const rightWall = new THREE.Group();
const right = new THREE.Mesh(new THREE.PlaneGeometry(DEPTH, H), M.right);
right.rotation.y = -Math.PI / 2; right.position.set(W2, H / 2, DEPTH / 2); right.receiveShadow = true;
rightWall.add(right);
room.add(floor, ceil, left, rightWall);

// back wall with a real window opening
const wallShape = new THREE.Shape();
wallShape.moveTo(-W2, 0); wallShape.lineTo(W2, 0); wallShape.lineTo(W2, H); wallShape.lineTo(-W2, H); wallShape.lineTo(-W2, 0);
const hole = new THREE.Path();
hole.moveTo(WIN.x0, WIN.y0); hole.lineTo(WIN.x0, WIN.y1); hole.lineTo(WIN.x1, WIN.y1); hole.lineTo(WIN.x1, WIN.y0); hole.lineTo(WIN.x0, WIN.y0);
wallShape.holes.push(hole);
const back = new THREE.Mesh(new THREE.ExtrudeGeometry(wallShape, { depth: 0.3, bevelEnabled: false }), M.back);
back.position.z = -0.3;
room.add(back);

// invisible occluder: casts the shadow that confines sunlight to the window opening
const occShape = new THREE.Shape();
occShape.moveTo(-60, -10); occShape.lineTo(60, -10); occShape.lineTo(60, 60); occShape.lineTo(-60, 60); occShape.lineTo(-60, -10);
occShape.holes.push(hole);
const occluder = new THREE.Mesh(new THREE.ShapeGeometry(occShape), new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: THREE.DoubleSide }));
occluder.position.z = -0.35; occluder.castShadow = true;
room.add(occluder);

// sky + sun seen through the window
const sky = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshBasicMaterial({ color: '#f3f6ff' }));
sky.position.set(0, 4, -10);
scene.add(sky);
const sunTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, '#fff'); gr.addColorStop(.6, '#fff'); gr.addColorStop(.68, 'rgba(227,236,255,1)'); gr.addColorStop(1, 'rgba(227,236,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const sunDisc = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, depthWrite: false }));
sunDisc.renderOrder = 10;
scene.add(sunDisc);

// window: glass panes, mullions (cast the grid into the light), outline that draws itself in
const winGroup = new THREE.Group(); room.add(winGroup);
const glassMat = new THREE.MeshBasicMaterial({ color: '#2a63ff', transparent: true, opacity: 0, depthWrite: false });
const pw = (WIN.x1 - WIN.x0) / WIN.cols, ph = (WIN.y1 - WIN.y0) / WIN.rows;
const panes = [];
for (let r = 0; r < WIN.rows; r++) for (let c = 0; c < WIN.cols; c++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(pw - WIN.bar, ph - WIN.bar), glassMat.clone());
  m.position.set(WIN.x0 + (c + .5) * pw, WIN.y1 - (r + .5) * ph, -0.12);
  m.renderOrder = 5;
  winGroup.add(m); panes.push({ r, c, m });
}
const barMat = lam('#ffffff');
faceMats.push(barMat);
const addBar = (w, h, x, y) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.26), barMat);
  b.position.set(x, y, -0.15); b.castShadow = true; winGroup.add(b);
};
for (let i = 1; i < WIN.cols; i++) addBar(WIN.bar, WIN.y1 - WIN.y0, WIN.x0 + i * pw, WC.y);
for (let i = 1; i < WIN.rows; i++) addBar(WIN.x1 - WIN.x0, WIN.bar, WC.x, WIN.y0 + i * ph);

const lineMat = c => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: .6 });
const winLines = (() => {
  const v = [];
  const rect = (x0, y0, x1, y1) => v.push(x0, y0, .01, x1, y0, .01, x1, y0, .01, x1, y1, .01, x1, y1, .01, x0, y1, .01, x0, y1, .01, x0, y0, .01);
  rect(WIN.x0 - .06, WIN.y0 - .06, WIN.x1 + .06, WIN.y1 + .06);
  panes.forEach(p => rect(p.m.position.x - (pw - WIN.bar) / 2, p.m.position.y - (ph - WIN.bar) / 2, p.m.position.x + (pw - WIN.bar) / 2, p.m.position.y + (ph - WIN.bar) / 2));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  const l = new THREE.LineSegments(g, lineMat('#1f5cff')); room.add(l); return l;
})();
const winLineCount = winLines.geometry.attributes.position.count;

// room edges: rebuilt each frame so they can draw in and follow the sliding wall
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(14 * 6), 3));
const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: '#1f5cff', transparent: true, opacity: .5 }));
edges.frustumCulled = false;
scene.add(edges);

// light shaft through the window (fades from window to floor)
const beamGeo = new THREE.BufferGeometry();
beamGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(8 * 3), 3));
beamGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array([
  .12, .36, 1, .13, .12, .36, 1, .13, .12, .36, 1, .13, .12, .36, 1, .13,
  .12, .36, 1, 0, .12, .36, 1, 0, .12, .36, 1, 0, .12, .36, 1, 0]), 4));
beamGeo.setIndex([0, 1, 5, 0, 5, 4, 1, 2, 6, 1, 6, 5, 2, 3, 7, 2, 7, 6, 3, 0, 4, 3, 4, 7]);
const beamMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide, opacity: 0 });
const beam = new THREE.Mesh(beamGeo, beamMat);
beam.frustumCulled = false; beam.renderOrder = 20;
scene.add(beam);

// blue-tinted light panes on the floor (the window's grid, following the sun) — reads on a white floor
const patchGeo = new THREE.BufferGeometry();
patchGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(16 * 4 * 3), 3));
patchGeo.setIndex(Array.from({ length: 16 }, (_, i) => [i * 4, i * 4 + 1, i * 4 + 2, i * 4, i * 4 + 2, i * 4 + 3]).flat());
const patchMat = new THREE.MeshBasicMaterial({ color: '#1f5cff', transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
const patch = new THREE.Mesh(patchGeo, patchMat);
patch.frustumCulled = false; patch.renderOrder = 2;
scene.add(patch);

// dust in the beam
const DUST = 30;
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DUST * 3), 3));
const dustMat = new THREE.PointsMaterial({ color: '#1f5cff', size: 0.035, transparent: true, opacity: 0, depthWrite: false });
const dust = new THREE.Points(dustGeo, dustMat); dust.frustumCulled = false; dust.renderOrder = 21;
scene.add(dust);
const motes = Array.from({ length: DUST }, () => ({ u: Math.random(), v: Math.random(), t: Math.random(), s: .6 + Math.random() * .9, ph: Math.random() * 6.28, sp: .15 + Math.random() * .35 }));

// ---------- furniture: modelled from primitives; each piece is a service ----------
const box = (mat, w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return m; };
const cyl = (mat, rt, rb, h, x, y, z, seg = 18, open = false) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat); m.position.set(x, y, z); return m; };
const MODELS = {
  ladder(mat) {
    const g = new THREE.Group();
    const front = new THREE.Group();
    front.add(box(mat, .07, 2.0, .07, -.33, 1.0, 0), box(mat, .07, 2.0, .07, .33, 1.0, 0));
    [.45, .9, 1.35].forEach(y => front.add(box(mat, .62, .05, .12, 0, y, 0)));
    front.add(box(mat, .72, .07, .4, 0, 1.98, -.12));
    front.rotation.x = -0.12; front.position.z = .2;
    const backLegs = new THREE.Group();
    backLegs.add(box(mat, .06, 2.0, .06, -.3, 1.0, 0), box(mat, .06, 2.0, .06, .3, 1.0, 0), box(mat, .6, .04, .05, 0, .6, 0));
    backLegs.rotation.x = 0.2; backLegs.position.z = -.25;
    g.add(front, backLegs);
    return g;
  },
  island(mat) {
    const g = new THREE.Group();
    g.add(box(mat, 2.84, .08, 1.15, 0, .95, 0), box(mat, 2.6, .82, 1.0, 0, .5, 0), box(mat, 2.44, .09, .9, 0, .045, 0));
    for (const sx of [-1.8, 1.8]) {
      g.add(cyl(mat, .22, .22, .06, sx, .74, .1));
      for (const [lx, lz] of [[-.13, -.13], [.13, -.13], [-.13, .13], [.13, .13]]) {
        const leg = cyl(mat, .018, .022, .74, sx + lx * 1.2, .37, .1 + lz * 1.2, 8);
        leg.rotation.set(-lz * .5, 0, lx * .5); g.add(leg);
      }
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.19, .014, 6, 24), mat);
      ring.rotation.x = Math.PI / 2; ring.position.set(sx, .26, .1); g.add(ring);
    }
    return g;
  },
  pendants(mat) {

    const bx = () => { const x0 = an[0] + dir * 20, x1 = x0 + dir * L; return [Math.min(x0, x1), Math.max(x0, x1), ly - (below ? 2 : 18), ly + (below ? 18 : 2)]; };
    for (let pass = 0; pass < 6; pass++) {
      const b = bx(), hit = placed.find(q => b[0] < q[1] && b[1] > q[0] && b[2] < q[3] && b[3] > q[2]);
      if (!hit) break;
      ly = below ? hit[3] + 4 + (ly - b[2]) : hit[2] - 4 - (b[3] - ly);
    }
    placed.push(bx());
    const p1 = [an[0] + dir * 20, ly], p2 = [p1[0] + dir * L, ly];
    o.cl.line.setAttribute('points', [an, p1, p2].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
    o.cl.line.setAttribute('stroke-dashoffset', 1 - easeInOut(kc));
    o.cl.dot.setAttribute('cx', an[0].toFixed(1)); o.cl.dot.setAttribute('cy', an[1].toFixed(1));
    o.cl.text.setAttribute('x', (p1[0] + dir * 6).toFixed(1)); o.cl.text.setAttribute('y', (ly + (below ? 15 : -6)).toFixed(1));
    o.cl.text.setAttribute('text-anchor', dir > 0 ? 'start' : 'end');
    o.cl.text.style.opacity = easeOut(prog(t, [o.at + 600, o.at + 1000]));
    o.cl.a.setAttribute('opacity', kc > 0 ? 1 : 0);
  }

  // door: frame draws in, then the door fades in; swings open on hover
  const pd = prog(t, T.door);
  doorGroup.visible = pd > 0;
  doorFrame.geometry.setDrawRange(0, Math.floor(6 * easeInOut(clamp(pd * 1.6)) / 2) * 2 || 0);
  const dIn = easeOut(clamp(pd * 1.6 - .6));
  doorwayMat.opacity = dIn; leafMat.opacity = dIn; leafMat.transparent = dIn < 1;
  doorOpen += (doorTarget - doorOpen) * .12;
  leafPivot.rotation.y = -easeInOut(doorOpen) * 1.2;
  spill.material.opacity = .14 * doorOpen;
  $('cta').classList.toggle('open', doorOpen > .5);
  if (!compact) {
    const d = P(DOOR.hinge[0], 0.35, DOOR.hinge[2]);
    $('cta').style.left = (d[0] + 14) + 'px';
    $('cta').style.top = (d[1] - 16) + 'px';
  }

  // logo: rides the back wall, then docks top-left; mirrored in the floor early on
  const s = C.f / C.z, tx = C.px - s * C.x, ty = C.py + s * C.y;
  const lw = { x: tx + s * LOGO.x, y: ty - s * LOGO.y, k: s * LOGO.size };
  const em = clamp(vw * 0.021, 22, 34);
  const lh = { x: clamp(vw * 0.025, 16, 40) - sx * 6, y: 22 + em * 0.8 - sy * 4, k: em };
  const pl = easeInOut(prog(t, T.logo));
  const lx = lerp(lw.x, lh.x, pl), lyy = lerp(lw.y, lh.y, pl), lk = lerp(lw.k, lh.k, pl);
  // anchor = text baseline (≈ 0.8em below the top of the box)
  $('logo').style.transform = `translate(${lx.toFixed(1)}px, ${(lyy - lk * .8).toFixed(1)}px) scale(${(lk / 100).toFixed(4)})`;
  $('logo').style.opacity = easeOut(prog(t, [150, 900]));
  const rk = s * LOGO.size, ry = ty + s * LOGO.y;
  $('logoReflect').style.transform = `translate(${lw.x.toFixed(1)}px, ${(ry + rk * .8).toFixed(1)}px) scale(${(rk / 100).toFixed(4)}, ${(-rk / 100).toFixed(4)})`;
  $('logoReflect').style.opacity = .2 * (1 - easeInOut(prog(t, T.reflect)));

  // bands
  for (const b of BANDS) {
    const k = easeOut(prog(t, b.time));
    const cx = lerp(b.from.x, b.to.x, k) - sx * b.to.par, cy = lerp(b.from.y, b.to.y, k) - sy * b.to.par * .6;
    b.el.style.transform = `translate(${(cx - b.len / 2).toFixed(1)}px, ${(cy - b.thick / 2).toFixed(1)}px) rotate(${lerp(b.from.a, b.to.a, k).toFixed(2)}deg)`;
    b.el.style.transformOrigin = '50% 50%';
    b.el.style.opacity = t > b.time[0] ? 1 : 0;
  }

  flag('menu-in', t > T.menu);
  flag('cta-in', t > T.cta);
  footer.style.setProperty('--prog', clamp(t / T.end).toFixed(3));

  renderer.render(scene, camera);
}

addEventListener('resize', layout);
layout();
measure();
document.fonts && document.fonts.ready.then(measure);
requestAnimationFrame(frame);
window.__seek = seek;
</script>
</body>
</html>
